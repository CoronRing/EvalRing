name: Release

# Publishes to PyPI when a version tag is pushed. Uses Trusted Publishing, so
# no API token is stored in the repository. Configure the publisher once at
# https://pypi.org/manage/project/evalring/settings/publishing/ with:
#   owner: CoronRing   repo: EvalRing   workflow: release.yml   environment: pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import glob, os, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          wheel = os.path.basename(glob.glob("dist/*.whl")[0])
          version = re.match(r"[^-]+-([^-]+)-", wheel).group(1)
          if version != tag:
              sys.exit(f"tag {tag} does not match packaged version {version}")
          print(f"tag and version agree: {version}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
