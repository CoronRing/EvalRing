name: Feature request
description: Suggest a capability EvalRing does not have.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The evaluation problem you are stuck on, not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The API, flag, or behaviour you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds, other tools, or why the current API does not fit.
